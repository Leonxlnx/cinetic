name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SKILL: cinetic

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Tool versions
        run: |
          echo "node $(node --version)"
          python3 --version
          echo "bash $BASH_VERSION"
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 22 ]; then
            echo "::error::Node.js 22 or newer is required, found $(node --version)"
            exit 1
          fi

      - name: SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys

          skill = os.environ["SKILL"]
          NAME_RE = re.compile(r"^[a-z0-9]+(-[a-z0-9]+)*$")
          KNOWN = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}


          def frontmatter(path):
              with open(path, "rb") as fh:
                  raw = fh.read()
              # The skills CLI matches /^---\r?\n/ on the raw text, so a BOM hides the frontmatter.
              if raw.startswith(b"\xef\xbb\xbf"):
                  raise ValueError("the file starts with a UTF-8 BOM; the skills CLI would skip this skill")
              lines = raw.decode("utf-8").replace("\r\n", "\n").split("\n")
              if lines[0].rstrip() != "---":
                  raise ValueError("the file must start with a '---' line")
              end = next((i for i in range(1, len(lines)) if lines[i].rstrip() == "---"), None)
              if end is None:
                  raise ValueError("the frontmatter has no closing '---' line")
              body, fields, i = lines[1:end], {}, 0
              while i < len(body):
                  m = re.match(r"^([A-Za-z0-9_-]+):[ \t]*(.*)$", body[i])
                  i += 1
                  if not m:
                      continue
                  key, raw = m.group(1), m.group(2).rstrip()
                  cont = []
                  while i < len(body) and (body[i][:1] in (" ", "\t") or not body[i].strip()):
                      cont.append(body[i].strip())
                      i += 1
                  if raw[:1] in ("|", ">"):
                      value = ("\n" if raw[0] == "|" else " ").join(cont).strip()
                  elif not raw:
                      value = "\n".join(c for c in cont if c)
                  else:
                      value = " ".join([raw] + [c for c in cont if c]).strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      elif key in ("name", "description") and (": " in value or " #" in value):
                          raise ValueError(f"'{key}' is an unquoted YAML value containing ': ' or ' #'; wrap it in quotes")
                  fields[key] = value
              return fields


          errors = 0


          def fail(path, message):
              global errors
              errors += 1
              print(f"::error file={path}::{message}")


          paths = sorted(glob.glob("skills/*/SKILL.md"))
          if f"skills/{skill}/SKILL.md" not in paths:
              fail(f"skills/{skill}/SKILL.md", "file not found")
          for path in paths:
              folder = os.path.basename(os.path.dirname(path))
              try:
                  fm = frontmatter(path)
              except ValueError as exc:
                  fail(path, str(exc))
                  continue
              name = fm.get("name", "")
              desc = fm.get("description", "")
              if not name:
                  fail(path, "missing 'name'")
              elif not NAME_RE.match(name) or len(name) > 64:
                  fail(path, f"name '{name}' must be 1-64 lowercase letters, digits and single hyphens")
              elif name != folder:
                  fail(path, f"name '{name}' does not match its directory '{folder}'")
              if not desc:
                  fail(path, "missing 'description'")
              elif len(desc) > 1024:
                  fail(path, f"description is {len(desc)} characters; the limit is 1024")
              elif "<" in desc or ">" in desc:
                  fail(path, "description must not contain '<' or '>'")
              for key in sorted(set(fm) - KNOWN):
                  print(f"::warning file={path}::frontmatter key '{key}' is not in the Agent Skills spec")
              print(f"{path}: name={name!r}, description={len(desc)} chars")
          sys.exit(1 if errors else 0)
          PY

      - name: JSON manifests
        run: |
          shopt -s nullglob
          status=0
          for f in .claude-plugin/*.json evals/*.json; do
            if python3 -m json.tool "$f" > /dev/null; then
              echo "ok   $f"
            else
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done
          exit "$status"

      - name: Line endings (.gitattributes)
        run: |
          # LF in the index, LF in every checkout (a CRLF script fails under WSL's bash with
          # "set: pipefail: invalid option name"), and binaries never converted
          status=0
          crlf="$(git ls-files --eol | awk '$1 ~ /crlf|mixed/ {print $NF}')"
          for f in $crlf; do echo "::error file=$f::stored with CRLF line endings"; status=1; done
          notlf="$(git ls-files -z -- '*.sh' '*.py' '*.mjs' '*.cjs' '*.js' '*.ts' '*.tsx' | xargs -0 -r git check-attr eol -- | awk -F': ' '$3 != "lf" {print $1}')"
          for f in $notlf; do echo "::error file=$f::not checked out with LF; add its type to .gitattributes"; status=1; done
          text="$(git ls-files -z -- '*.png' '*.jpg' '*.gif' '*.woff2' '*.wav' '*.mp4' | xargs -0 -r git check-attr text -- | awk -F': ' '$3 != "unset" {print $1}')"
          for f in $text; do echo "::error file=$f::a binary file is not marked binary in .gitattributes"; status=1; done
          echo "$(git ls-files | wc -l | tr -d ' ') files: LF in the index, scripts check out with LF, binaries marked"
          exit "$status"

      - name: Plugin manifests agree
        run: |
          python3 - <<'PY'
          import json
          import sys

          errors = []
          mkt = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          plg = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          name = plg.get("name")
          entries = [e for e in mkt.get("plugins", []) if e.get("name") == name]
          if not entries:
              errors.append(f"marketplace.json has no plugins[] entry named {name!r} (the plugin.json name)")
          for e in entries:
              src = e.get("source")
              if not (isinstance(src, str) and src.startswith("./")):
                  errors.append(f"entry source {src!r} must be a string starting with './'; the skills CLI skips anything else")
              if "version" in e:
                  errors.append("set version in plugin.json only, not also in the marketplace entry")
          if not plg.get("version"):
              errors.append("plugin.json has no version")
          for msg in errors:
              print(f"::error file=.claude-plugin/marketplace.json::{msg}")
          print(f"plugin {name!r}, version {plg.get('version')!r}, {len(entries)} matching entry")
          sys.exit(1 if errors else 0)
          PY

      - name: skills CLI discovers the skill
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          # The CLI draws its list rail as '|' under TERM=linux and as U+2502 elsewhere (GitHub runners).
          out="$(npx -y skills@1.7.0 add . --list 2>&1 | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g')" || true
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qxE "(\||│)[[:space:]]+${SKILL}[[:space:]]*"; then
            echo "::error::npx skills add . --list did not list '$SKILL'"
            exit 1
          fi

      - name: Lint-film regression tests
        run: node "skills/$SKILL/scripts/test/lint-film.test.mjs"

      - name: Technique library and pick.py tests
        run: python3 "skills/$SKILL/scripts/test/pick.test.py"

      - name: Install the Remotion starter (for its type check and grid-check cases)
        run: cd "skills/$SKILL/assets/remotion-starter" && npm install --no-audit --no-fund --loglevel=error

      - name: Remotion starter type check (tsc --noEmit)
        run: cd "skills/$SKILL/assets/remotion-starter" && npx tsc --noEmit

      - name: Grid-check regression tests (fixtures, both starters, new-film.sh --pace crisp)
        run: |
          node "skills/$SKILL/scripts/test/grid-check.test.mjs" | tee "$RUNNER_TEMP/grid.log"
          if grep -q '^skip  the Remotion starter' "$RUNNER_TEMP/grid.log"; then
            echo "::error::the Remotion starter cases were skipped (its npm install did not take)"
            exit 1
          fi

      - name: Score regression tests (score.py against main's, bit for bit on the synth engine)
        run: |
          # a venv: the runner's system Python is externally managed (PEP 668)
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet numpy scipy soundfile pyloudnorm librosa
          base=()
          # main's score.py and its siblings, to compare the synth engine against bit for bit
          if git fetch --no-tags --depth=1 origin main 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/main"
            git archive FETCH_HEAD "skills/$SKILL/scripts/audio" | tar -x -C "$RUNNER_TEMP/main"
            if [ -f "$RUNNER_TEMP/main/skills/$SKILL/scripts/audio/score.py" ]; then
              base=(--baseline "$RUNNER_TEMP/main/skills/$SKILL/scripts/audio/score.py")
            fi
          fi
          [ "${#base[@]}" -gt 0 ] || echo "::notice::main could not be fetched; score.test.py runs without --baseline"
          "$RUNNER_TEMP/venv/bin/python" "skills/$SKILL/scripts/test/score.test.py" "${base[@]}"

      - name: Script --help contract and docs tests
        run: node "skills/$SKILL/scripts/test/scripts-docs.test.mjs"

      - name: Python syntax (py_compile)
        run: |
          shopt -s globstar nullglob
          files=(skills/"$SKILL"/scripts/**/*.py)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no .py files under skills/$SKILL/scripts"
            exit 1
          fi
          printf 'compile %s\n' "${files[@]}"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile "${files[@]}"

      - name: Node script syntax (node --check)
        run: |
          shopt -s globstar nullglob
          files=(skills/"$SKILL"/scripts/**/*.mjs skills/"$SKILL"/scripts/**/*.cjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no .mjs or .cjs files under skills/$SKILL/scripts"
            exit 1
          fi
          status=0
          for f in "${files[@]}"; do
            if node --check "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::node --check failed"
              status=1
            fi
          done
          exit "$status"

      - name: Shell syntax (bash -n)
        run: |
          shopt -s globstar nullglob
          status=0
          count=0
          for f in **/*.sh; do
            case "$f" in */node_modules/*) continue ;; esac
            count=$((count + 1))
            if bash -n "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::bash -n failed"
              status=1
            fi
          done
          echo "$count shell scripts checked"
          exit "$status"

  bash32:
    # macOS ships bash 3.2.57 as /bin/bash, and its parser accepts less than the bash 5 above: it
    # scans the text of a $( ) for the closing paren as shell code, heredoc bodies included (#2).
    name: bash 3.2 (macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      BASH32: bash:3.2.57
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: No heredoc inside $( ), backticks or <( )
        run: |
          # a multi-line scan (quotes, comments, heredoc bodies, nesting); it reports each heredoc
          # with the fix: move it into a shell function and call that inside the substitution
          git ls-files -z '*.sh' | xargs -0 python3 "skills/$SKILL/scripts/test/bash32.test.py"

      - name: Shell syntax under bash 3.2 (bash -n)
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          docker run --rm -v "$PWD:/w:ro" -w /w --entrypoint bash "$BASH32" -c '
            echo "bash $BASH_VERSION"
            status=0
            for f in "$@"; do
              if bash -n "$f"; then
                echo "ok   $f"
              else
                echo "::error file=$f::bash 3.2 -n failed"
                status=1
              fi
            done
            echo "$# shell scripts checked"
            exit "$status"' bash32 "${files[@]}"

      - name: HyperFrames preflight under bash 3.2 (npm run cues)
        run: |
          # A fresh starter has no fonts or vendor/gsap.min.js yet: the preflight writes the cues and
          # then reports those files missing (exit 1). A script bash 3.2 cannot parse writes nothing.
          docker run --rm -v "$PWD:/w:ro" -w /w -e SKILL --entrypoint bash "$BASH32" -c '
            apk add --no-cache nodejs > /dev/null || exit 1
            echo "bash $BASH_VERSION, node $(node --version)"
            out=$(mktemp -d)
            bash "skills/$SKILL/scripts/hf-finish.sh" "skills/$SKILL/assets/hyperframes-starter" \
              --export-cues "$out/cues.json" 2> "$out/err"
            rc=$?
            cat "$out/err"
            if [ "$rc" -gt 1 ] || ! grep -qE "^hf-finish: (wrote|preflight failed)" "$out/err"; then
              echo "::error::hf-finish.sh did not get through its preflight under bash 3.2 (exit $rc)"
              exit 1
            fi
            node -e "const c = require(process.argv[1]); if (!(c.total > 0 && c.events.length)) process.exit(1); console.log(c.total + \" frames, \" + c.events.length + \" events\")" "$out/cues.json" \
              || { echo "::error::hf-finish.sh --export-cues wrote no valid cues under bash 3.2"; exit 1; }'

  macos:
    # The platform of #2, for real: Apple's /bin/bash 3.2.57, BSD sed/tar/wc, and Homebrew's ffmpeg
    # (7.1 or newer, which takes a file's colour tags from the frames). The bash32 job above only
    # emulates the shell in a Linux container, and Ubuntu's ffmpeg 6.1 passes the encodes either way.
    name: macOS (bash 3.2, BSD tools, current ffmpeg)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ffmpeg and numpy
        run: |
          brew install ffmpeg > /dev/null
          python -m pip install --quiet numpy

      - name: Tool versions
        run: |
          v="$(/bin/bash -c 'echo "$BASH_VERSION"')"
          echo "/bin/bash $v, node $(node --version), $(python --version), $(ffmpeg -version | head -n 1)"
          case "$v" in
            3.2.*) ;;
            *) echo "::error::/bin/bash is $v, not 3.2: this job no longer tests macOS's stock bash"; exit 1 ;;
          esac
          ff="$(ffmpeg -version | head -n 1 | awk '{print $3}')"
          case "$ff" in
            [0-6].*|7.0|7.0.*) echo "::warning::ffmpeg $ff is older than 7.1: the encode checks pass with or without setparams" ;;
            [0-9]*) ;;
            *) echo "::warning::could not read the ffmpeg version ('$ff')" ;;
          esac

      - name: Shell syntax under /bin/bash (bash -n)
        run: |
          status=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if /bin/bash -n "$f"; then
              echo "ok   $f"
            else
              echo "::error file=$f::/bin/bash -n failed"
              status=1
            fi
          done < <(git ls-files '*.sh')
          echo "$count shell scripts checked with /bin/bash $(/bin/bash -c 'echo "$BASH_VERSION"')"
          exit "$status"

      - name: HyperFrames preflight under /bin/bash (npm run cues)
        run: |
          # As in the bash32 job: a fresh starter has no fonts or vendor/gsap.min.js, so the preflight
          # writes the cues and then reports those files missing (exit 1).
          out="$RUNNER_TEMP/hf"
          mkdir -p "$out"
          rc=0
          /bin/bash "skills/$SKILL/scripts/hf-finish.sh" "skills/$SKILL/assets/hyperframes-starter" \
            --export-cues "$out/cues.json" 2> "$out/err" || rc=$?
          cat "$out/err"
          if [ "$rc" -gt 1 ] || ! grep -qE '^hf-finish: (wrote|preflight failed)' "$out/err"; then
            echo "::error::hf-finish.sh did not get through its preflight under /bin/bash (exit $rc)"
            exit 1
          fi
          node -e 'const c = require(process.argv[1]); if (!(c.total > 0 && c.events.length)) process.exit(1); console.log(c.total + " frames, " + c.events.length + " events")' "$out/cues.json" \
            || { echo "::error::hf-finish.sh --export-cues wrote no valid cues under /bin/bash"; exit 1; }

      - name: Scaffold and script refresh with BSD tools (new-film.sh, docs/setup.md)
        run: |
          film="$RUNNER_TEMP/film"
          /bin/bash "skills/$SKILL/scripts/new-film.sh" "$film" --engine hyperframes --no-install
          [ ! -e "$film/scripts/test" ] || { echo "::error::new-film.sh copied the skill's tests into the project"; exit 1; }
          # the refresh command docs/setup.md gives, run from the project root with BSD tar
          rm "$film/scripts/hf-finish.sh"  # the refresh must bring it back
          SKILL="$PWD/skills/$SKILL"
          (cd "$film" && (cd "$SKILL/scripts" && tar --exclude=__pycache__ --exclude='*.pyc' --exclude=./test -cf - .) | (cd scripts && tar -xf -))
          [ ! -e "$film/scripts/test" ] || { echo "::error::the docs/setup.md refresh copied scripts/test into the project"; exit 1; }
          cmp "$SKILL/scripts/hf-finish.sh" "$film/scripts/hf-finish.sh"
          rc=0
          (cd "$film" && /bin/bash scripts/hf-finish.sh . --export-cues out/cues.json) 2> "$RUNNER_TEMP/film-err" || rc=$?
          cat "$RUNNER_TEMP/film-err"
          if [ "$rc" -gt 1 ] || [ ! -s "$film/out/cues.json" ]; then
            echo "::error::the scaffolded project's hf-finish.sh did not export cues under /bin/bash (exit $rc)"
            exit 1
          fi

      - name: Encode tags test (Homebrew ffmpeg)
        run: python "skills/$SKILL/scripts/test/encode-tags.test.py"

  encode-tags:
    # ffmpeg 7.1 and newer take a file's colour tags from the frames (#2). The test's static part
    # checks every BT.709-tagged encode for setparams; its encodes run on the runner's ffmpeg.
    name: BT.709 encode tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ffmpeg and numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg python3-numpy > /dev/null
          ffmpeg -version | head -n 1

      - name: Encode tags test
        run: python3 "skills/$SKILL/scripts/test/encode-tags.test.py"
