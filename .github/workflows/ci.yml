name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SKILL: cinetic

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Tool versions
        run: |
          echo "node $(node --version)"
          python3 --version
          echo "bash $BASH_VERSION"
          major="$(node -p 'process.versions.node.split(".")[0]')"
          if [ "$major" -lt 22 ]; then
            echo "::error::Node.js 22 or newer is required, found $(node --version)"
            exit 1
          fi

      - name: SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re
          import sys

          skill = os.environ["SKILL"]
          NAME_RE = re.compile(r"^[a-z0-9]+(-[a-z0-9]+)*$")
          KNOWN = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}


          def frontmatter(path):
              with open(path, "rb") as fh:
                  raw = fh.read()
              # The skills CLI matches /^---\r?\n/ on the raw text, so a BOM hides the frontmatter.
              if raw.startswith(b"\xef\xbb\xbf"):
                  raise ValueError("the file starts with a UTF-8 BOM; the skills CLI would skip this skill")
              lines = raw.decode("utf-8").replace("\r\n", "\n").split("\n")
              if lines[0].rstrip() != "---":
                  raise ValueError("the file must start with a '---' line")
              end = next((i for i in range(1, len(lines)) if lines[i].rstrip() == "---"), None)
              if end is None:
                  raise ValueError("the frontmatter has no closing '---' line")
              body, fields, i = lines[1:end], {}, 0
              while i < len(body):
                  m = re.match(r"^([A-Za-z0-9_-]+):[ \t]*(.*)$", body[i])
                  i += 1
                  if not m:
                      continue
                  key, raw = m.group(1), m.group(2).rstrip()
                  cont = []
                  while i < len(body) and (body[i][:1] in (" ", "\t") or not body[i].strip()):
                      cont.append(body[i].strip())
                      i += 1
                  if raw[:1] in ("|", ">"):
                      value = ("\n" if raw[0] == "|" else " ").join(cont).strip()
                  elif not raw:
                      value = "\n".join(c for c in cont if c)
                  else:
                      value = " ".join([raw] + [c for c in cont if c]).strip()
                      if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                          value = value[1:-1]
                      elif key in ("name", "description") and (": " in value or " #" in value):
                          raise ValueError(f"'{key}' is an unquoted YAML value containing ': ' or ' #'; wrap it in quotes")
                  fields[key] = value
              return fields


          errors = 0


          def fail(path, message):
              global errors
              errors += 1
              print(f"::error file={path}::{message}")


          paths = sorted(glob.glob("skills/*/SKILL.md"))
          if f"skills/{skill}/SKILL.md" not in paths:
              fail(f"skills/{skill}/SKILL.md", "file not found")
          for path in paths:
              folder = os.path.basename(os.path.dirname(path))
              try:
                  fm = frontmatter(path)
              except ValueError as exc:
                  fail(path, str(exc))
                  continue
              name = fm.get("name", "")
              desc = fm.get("description", "")
              if not name:
                  fail(path, "missing 'name'")
              elif not NAME_RE.match(name) or len(name) > 64:
                  fail(path, f"name '{name}' must be 1-64 lowercase letters, digits and single hyphens")
              elif name != folder:
                  fail(path, f"name '{name}' does not match its directory '{folder}'")
              if not desc:
                  fail(path, "missing 'description'")
              elif len(desc) > 1024:
                  fail(path, f"description is {len(desc)} characters; the limit is 1024")
              elif "<" in desc or ">" in desc:
                  fail(path, "description must not contain '<' or '>'")
              for key in sorted(set(fm) - KNOWN):
                  print(f"::warning file={path}::frontmatter key '{key}' is not in the Agent Skills spec")
              print(f"{path}: name={name!r}, description={len(desc)} chars")
          sys.exit(1 if errors else 0)
          PY

      - name: JSON manifests
        run: |
          shopt -s nullglob
          status=0
          for f in .claude-plugin/*.json evals/*.json; do
            if python3 -m json.tool "$f" > /dev/null; then
              echo "ok   $f"
            else
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done
          exit "$status"

      - name: Line endings (.gitattributes)
        run: |
          # LF in the index, LF in every checkout (a CRLF script fails under WSL's bash with
          # "set: pipefail: invalid option name"), and binaries never converted
          status=0
          crlf="$(git ls-files --eol | awk '$1 ~ /crlf|mixed/ {print $NF}')"
          for f in $crlf; do echo "::error file=$f::stored with CRLF line endings"; status=1; done
          notlf="$(git ls-files -z -- '*.sh' '*.py' '*.mjs' '*.cjs' '*.js' '*.ts' '*.tsx' | xargs -0 -r git check-attr eol -- | awk -F': ' '$3 != "lf" {print $1}')"
          for f in $notlf; do echo "::error file=$f::not checked out with LF; add its type to .gitattributes"; status=1; done
          text="$(git ls-files -z -- '*.png' '*.jpg' '*.gif' '*.woff2' '*.wav' '*.mp4' | xargs -0 -r git check-attr text -- | awk -F': ' '$3 != "unset" {print $1}')"
          for f in $text; do echo "::error file=$f::a binary file is not marked binary in .gitattributes"; status=1; done
          echo "$(git ls-files | wc -l | tr -d ' ') files: LF in the index, scripts check out with LF, binaries marked"
          exit "$status"

      - name: Plugin manifests agree
        run: |
          python3 - <<'PY'
          import json
          import sys

          errors = []
          mkt = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          plg = json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))
          name = plg.get("name")
          entries = [e for e in mkt.get("plugins", []) if e.get("name") == name]
          if not entries:
              errors.append(f"marketplace.json has no plugins[] entry named {name!r} (the plugin.json name)")
          for e in entries:
              src = e.get("source")
              if not (isinstance(src, str) and src.startswith("./")):
                  errors.append(f"entry source {src!r} must be a string starting with './'; the skills CLI skips anything else")
              if "version" in e:
                  errors.append("set version in plugin.json only, not also in the marketplace entry")
          if not plg.get("version"):
              errors.append("plugin.json has no version")
          for msg in errors:
              print(f"::error file=.claude-plugin/marketplace.json::{msg}")
          print(f"plugin {name!r}, version {plg.get('version')!r}, {len(entries)} matching entry")
          sys.exit(1 if errors else 0)
          PY

      - name: skills CLI discovers the skill
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          # The CLI draws its list rail as '|' under TERM=linux and as U+2502 elsewhere (GitHub runners).
          out="$(npx -y skills@1.7.0 add . --list 2>&1 | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g')" || true
          printf '%s\n' "$out"
          if ! printf '%s\n' "$out" | grep -qxE "(\||│)[[:space:]]+${SKILL}[[:space:]]*"; then
            echo "::error::npx skills add . --list did not list '$SKILL'"
            exit 1
          fi

      - name: No audio and no video in git
        run: |
          # A film's licensed track and everything mixed from it stay out of git, and demo films live on the
          # media branch: this branch carries no audio file and no video file at all.
          bad="$(git ls-files | grep -iE '\.(wav|mp3|flac|ogg|m4a|aac|aif|aiff|opus|mp4|mov|m4v|webm|mkv)$' || true)"
          if [ -n "$bad" ]; then
            while IFS= read -r f; do echo "::error file=$f::audio or video tracked by git"; done <<< "$bad"
            exit 1
          fi
          echo "$(git ls-files | wc -l | tr -d ' ') tracked files, no audio and no video"


      - name: Install the kit
        working-directory: skills/cinetic/kit
        run: npm ci --no-audit --no-fund

      - name: Kit type check (tsc --noEmit, every example film)
        working-directory: skills/cinetic/kit
        run: npx tsc --noEmit

      - name: Node script syntax (node --check)
        run: |
          status=0
          for f in skills/cinetic/kit/scripts/*.mjs; do
            node --check "$f" && echo "ok   $f" || { echo "::error file=$f::syntax error"; status=1; }
          done
          exit "$status"

      - name: Motion library catalogue (docs, exports and reels agree)
        working-directory: skills/cinetic/kit
        run: node scripts/library-docs.mjs --check

      - name: Motion library usage lines (every prop a doc names exists on the piece)
        working-directory: skills/cinetic/kit
        run: node scripts/library-props.mjs --check

      - name: Catalogues parse (sound effects, music shortlist, logo brands)
        run: |
          node -e "
          const fs = require('fs');
          const dir = 'skills/cinetic/kit/scripts/';
          const sfx = JSON.parse(fs.readFileSync(dir + 'sfx-catalogue.json', 'utf8'));
          if (!Array.isArray(sfx.sounds) || sfx.sounds.length < 50) throw new Error('sfx catalogue: expected 50+ sounds');
          for (const s of sfx.sounds) { for (const k of ['id', 'role', 'licence']) if (!s[k]) throw new Error('sfx ' + s.id + ': missing ' + k); if (!s.file_url && !s.archive_url) throw new Error('sfx ' + s.id + ': no file_url or archive_url'); }
          const music = JSON.parse(fs.readFileSync(dir + 'music-shortlist.json', 'utf8'));
          for (const t of music.tracks) for (const k of ['title', 'file_url', 'licence']) if (!t[k]) throw new Error('music ' + t.title + ': missing ' + k);
          JSON.parse(fs.readFileSync(dir + 'logo-brands.json', 'utf8'));
          console.log(sfx.sounds.length + ' sounds, ' + music.tracks.length + ' tracks');
          "

      - name: Scaffold a film and type-check it (new-film.mjs)
        run: |
          tmp="$(mktemp -d)"
          node skills/cinetic/kit/scripts/new-film.mjs "$tmp/film" --name "Probe" --no-install
          ln -s "$PWD/skills/cinetic/kit/node_modules" "$tmp/film/node_modules"
          (cd "$tmp/film" && npx tsc --noEmit && node scripts/frames.mjs > /dev/null && node scripts/sfx.mjs roles > /dev/null)
          echo "scaffolded and type-checked $tmp/film"

      - name: References are linked and exist
        run: |
          python3 - <<'PY'
          import os, re, sys
          root = "skills/cinetic"
          bad = 0
          for dirpath, _, files in os.walk(root):
              if "node_modules" in dirpath:
                  continue
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  p = os.path.join(dirpath, f)
                  for link in re.findall(r"\]\(([^)#\s]+\.md)(?:#[^)]*)?\)", open(p, encoding="utf-8").read()):
                      if link.startswith("http"):
                          continue
                      target = os.path.normpath(os.path.join(dirpath, link))
                      if not os.path.exists(target):
                          print(f"::error file={p}::broken link {link}")
                          bad += 1
          size = os.path.getsize(os.path.join(root, "SKILL.md"))
          print(f"SKILL.md {size} bytes")
          if size > 25000:
              print("::error file=skills/cinetic/SKILL.md::over 25,000 bytes")
              bad += 1
          sys.exit(1 if bad else 0)
          PY

  macos:
    name: macOS (scaffold and type check)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install the kit and type-check
        working-directory: skills/cinetic/kit
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: Scaffold a film (BSD tools)
        run: |
          tmp="$(mktemp -d)"
          node skills/cinetic/kit/scripts/new-film.mjs "$tmp/film" --name "Probe" --no-install
          ln -s "$PWD/skills/cinetic/kit/node_modules" "$tmp/film/node_modules"
          (cd "$tmp/film" && npx tsc --noEmit)
